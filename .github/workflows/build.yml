name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Cafe.sln
      - name: Build
        run: dotnet build Cafe.sln --no-restore -c Release 2>&1 | tee build.txt; exit ${PIPESTATUS[0]}
      - name: Test
        run: dotnet test Cafe.sln --no-build -c Release --logger "console;verbosity=detailed" 2>&1 | tee test.txt; exit ${PIPESTATUS[0]}
      - name: Check EF model snapshot
        id: ef
        continue-on-error: true
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.*
          cd src/Cafe.API
          dotnet ef migrations has-pending-model-changes 2>&1 | tee ../../ef.txt; exit ${PIPESTATUS[0]}
      - name: Generate sync migration
        if: steps.ef.outcome == 'failure'
        continue-on-error: true
        run: |
          cd src/Cafe.API
          NAME="AutoSync${GITHUB_RUN_NUMBER}"
          dotnet ef migrations add "$NAME" 2>&1 | tail -5
          { echo '## Generated migration'; echo '```'; cat Migrations/*_${NAME}.cs; echo '```';
            echo '## Snapshot diff'; echo '```diff'; git diff -U2 Migrations/ApplicationDbContextModelSnapshot.cs; echo '```'; } > ../../migration.md
      - name: Publish migration
        if: steps.ef.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 64000 migration.md > m.md
          gh api repos/${{ github.repository }}/check-runs -f name="migration-report" -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral -f "output[title]=Sync migration" -F "output[summary]=@m.md"
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## dotnet build (warnings/errors)'; grep -E "warning|error" build.txt | grep -v "^ *$" | sort -u | tail -150 || true;
            echo; echo '## EF has-pending-model-changes'; tail -60 ef.txt 2>/dev/null || true;
            echo; echo '## Tests'; grep -E "Failed |Error Message|Assert|Total tests|Passed!|Failed!" test.txt 2>/dev/null | head -60 || true;
            grep -E "Passed|: [0-9]+ —" test.txt 2>/dev/null | head -80 || true; } > report.md
          gh api repos/${{ github.repository }}/check-runs -f name="backend-report" -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral -f "output[title]=Backend report" -F "output[summary]=@report.md"

  migrations:
    # Все миграции должны применяться к пустой базе
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: dev123
          POSTGRES_DB: cafe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devuser -d cafe_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply migrations to empty database
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=cafe_ci;Username=devuser;Password=dev123
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.*
          cd src/Cafe.API
          dotnet ef database update 2>&1 | tee ../../migrate.txt; exit ${PIPESTATUS[0]}
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## dotnet ef database update'; grep -vE "^\s*$" migrate.txt | grep -iE "fail|error|exception|42P|Applying|Done|No migrations" | tail -80; } > report.md
          gh api repos/${{ github.repository }}/check-runs -f name="migrations-report" -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral -f "output[title]=Migrations report" -F "output[summary]=@report.md"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build 2>&1 | tee build.txt; exit ${PIPESTATUS[0]}
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## npm run build'; grep -E "error TS" build.txt | head -300 || true; echo; echo '## tail'; tail -40 build.txt | sed 's/\x1b\[[0-9;]*m//g'; } > report.md
          gh api repos/${{ github.repository }}/check-runs -f name="frontend-report" -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral -f "output[title]=Frontend report" -F "output[summary]=@report.md"
